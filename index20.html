<!--create a html page to create an object "emp" that contains basic details of an employee. print that data inside a p tag on button click-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <script>
    function printEmp()
    {
     var emp={EmpId:101,Name:"Rahul Sharma",Age:34,Department:"IT Department", Salary:67000};
     var content="Employee Id: "+emp.EmpId+"<br>Employee Name: "+emp.Name+"<br>Age: "+emp.Age+"<br>Department: "+emp.Department+"<br>Salary: "+emp.Salary;
     document.getElementById("para").innerHTML=content;
    }

    </script>
</head>
<body>
    <input type="button" value="Print Employee Data" onclick="printEmp()" />
    <br><br>
    <p id="para"></p>
</body>
</html>

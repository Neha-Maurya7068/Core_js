<!-- create a html page to demonstrate event handling in js-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>
     function demo()
     {
        alert("Hello");
     }
</script>
<body onload="demo()">
    <input type="button" value="Click here" onclick="demo()" />
</body>
</html>

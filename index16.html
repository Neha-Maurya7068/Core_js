<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var str="My name is marsdon Richard.";
        var x,y,p,q,r;
        y=str.length;
        alert("Length of string is: "+y);
        x=str.charAt(4);
        alert("Character at index4: "+x);
        p=str.charCodeAt(4);
        alert("ASCII value of 4th index character: "+p);
        q=str.indexOf('n');
        alert("Index of n: "+q);
        r=str.lastIndexOf('n');
        alert("Last index of n: "+r);
        var s=str.substring(3,10);
        alert("Substring of 3 to 10: "+s);
        s=str.substring(3);
        alert("Substring from 3: "+s);
        x=str.split(' ');
        alert("After split array items are: "+x);
        y=str.toUpperCase();
        alert("Uppercase of string is: "+y);
        p=str.toLowerCase();
        alert("Lowercase of string is: "+p);
    </script>
</head>
<body>
    
</body>
</html>

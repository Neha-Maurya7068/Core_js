<!--create a html page to demonstrate use of confirm box.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var r;
        r=confirm("Are you sure want to delete?");
        if(r==true)
        alert("Record deleted sucessfully.");
        else
        alert("Record will not be deleted.");
    </script>
</head>

</body>
</html>

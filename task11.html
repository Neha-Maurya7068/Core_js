<!DOCTYPE html>
<html lang="en">
<head>

    <title>Find Max Number</title>
    <script type="text/javascript">
        function findMaxNumber() {
            // Statically initialized array with 10 numbers
            var numbers = [23, 45, 67, 12, 89, 34, 56, 78, 90, 22];
            
            // Use Math.max along with the spread operator to find the maximum number
            var maxNumber = Math.max(23,45,67,12,89,34,);

            // Show the result in an alert box
            alert("The maximum number is: " + maxNumber);
        }
    </script>
</head>

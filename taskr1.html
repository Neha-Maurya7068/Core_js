<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Greatest Number</title>
    <script>
        function findGreatest() {
            // Get values from text boxes
            const num1 = parseFloat(document.getElementById('number1').value);
            const num2 = parseFloat(document.getElementById('number2').value);

            // Find the greatest number
            const greatest = Math.max(num1, num2);

            // Display result in the paragraph
            document.getElementById('result').innerText = 'Greatest Number: ' + greatest;
        }
    </script>
</head>
<body>
    <h1>Find Greatest Number</h1>
    
    <label for="number1">Number 1:</label>
    <input type="text" id="number1"><br><br>

    <label for="number2">Number 2:</label>
    <input type="text" id="number2"><br><br>

    <button onclick="findGreatest()">Find Greatest</button>

    <p id="result"></p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function checkPrime()
        {
            var num,msg,sp,x,count=0;
            num=document.getElementById("tnum").value;
            sp=document.getElementById("spresult");
            for(x=1;x<=num;x++)
            {
                if(num%x==0)
                count++;
            }
            if(count==2)
            msg="Number is a prime number.";
        else
        msg="Number is not a prime number.";
        sp.innerHTML=msg;
        }
    </script>
</head>
<body>
    <input type="number" id="tnum" placeholder="Enter a number"><br><br>
    <input type="button" value="Click Here" onclick="checkPrime()" /><br><br>
    <span id="spresult"></span>
</body>
</html>

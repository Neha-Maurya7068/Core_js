<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function CheckEO(){
            var num1,res;
            num1=document.getElementById("tnum1").value;
            
            if(num1%2==0)
            {
                res="Number is even.";
                
            }
            else{
                res="Number is Odd.";
            }
        document.getElementById("sp").innerText=res;
        }
    </script>
</head>
<body>
    <input type="number" placeholder="enter number" id="tnum1"><br><br>
    <input type="button" value="EvenOdd" onclick="CheckEO()" />
    <br><br/>
    <span id="sp"></span>
</body>
</html>

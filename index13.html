<!--create a html page to display a simple slider by using JS-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var imgno=0;
       function moveSlider()
       {
        var pics=["building.jpg","garden.jpg","human.jpg","nature.jpg","turtle.jpg"];
        var myimg=document.getElementById("imgslide");
        myimg.src="images/"+pics[imgno];
        imgno++;
        if(imgno==pics.length)
        imgno=0;
        window.setTimeout("moveSlider()",4000);
       }
    </script>
</head>    
<body onload="moveSlider()">
    <img id="imgslide" width="100%" height="450px" />
</body>
</html>

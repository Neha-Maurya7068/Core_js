<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" id="txtInput" placeholder="please enter the value"><br><br>
    <input type="button" onclick="demo()" value="Click Here"><br><br>
    <div id="res"></div>
</body>
<script>
    function demo(){
        var a,b,num1;
        a=document.getElementById('txtInput');
        num1=a.value;
        if(num1%2==0)
        document.getElementById('res').innerHTML=`The even Number = ${num1}`;
        else
        document.getElementById('res').innerHTML=`The Odd Number = ${num1}`;
    }
</script>
</html>

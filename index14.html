<!--Demonstrate use of array sorting and searching-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var cities=["prayagraj","agra","Jhansi","lucknow","kanpur",];
        alert("Items of array: "+cities);
        cities.sort();
        alert("After sorting items are: "+cities);
        var x=cities.indexOf("jhansi");
        if(x>=0)
        alert("item found at index:"+x);
    else
    alert("item not found in array.");
    </script>
</head>
<body>
    
</body>
</html>

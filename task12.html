<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Slider</title>
    <style>
        /* Style for the slider container */
        #slider-container {
            width: 100%;
            max-width: 600px;
            height: 300px;
            overflow: hidden;
            margin: 0 auto;
            border: 2px solid #ddd;
        }

        /* Style for the images */
        .slider-images img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .slider-images {
            display: flex;
            transition: transform 1s ease;
        }
    </style>
    <script type="text/javascript">
        var currentIndex = 0;

        function startSlider() {
            var sliderImages = document.querySelector(".slider-images");
            var images = document.querySelectorAll(".slider-images img");

            function slide() {
                currentIndex++;
                if (currentIndex >= images.length) {
                    currentIndex = 0;
                }

                var offset = currentIndex * -100; // Move slider by 100% for each image
                sliderImages.style.transform = "translateX(" + offset + "%)";
            }

            // Change slide every 3 seconds
            setInterval(slide, 3000);
        }
    </script>
</head>
<body onload="startSlider()">

    <div id="slider-container">
        <div class="slider-images">
            <img src="/images/garden.jpg" alt="garden">
            <img src="/images/nature.jpg" alt="nature">
            <img src="images/human.jpg" alt="human">
        </div>
    </div>

</body>
</html>

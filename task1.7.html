<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <input type="number" id="txtInput1" placeholder="Please enter the first value"><br><br>
   <input type="number" id="txtInput2" placeholder="Please enter the Second value"><br><br>
   <input type="number" id="txtInput3" placeholder="Please enter the third value"><br><br>
   <input type="button" value="Click me" onclick="calculate()"><br><br>
   <div id="sir"></div>

</body>
<script>
    function calculate(){
        var a,b,c,num1,num2,num3;
        a=document.getElementById('txtInput1');
        num1=a.value;
         b=document.getElementById('txtInput2');
        num2=b.value;
        c=document.getElementById('txtInput3');
        num3=c.value;
        if(num1>num2&&num1>num3){
            document.getElementById('sir').innerHTML=`The greatest value is first =${num1}`;
        }
        else if(num2>num1&&num2>num3){
            document.getElementById('sir').innerHTML=`The greatest value is second =${num2}`;
        }
        else {
            document.getElementById('sir').innerHTML=`The greatest value is third =${num3}`;
        }

    }
</script>
</html>
